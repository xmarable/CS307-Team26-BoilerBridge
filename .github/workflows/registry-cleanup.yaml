name: Registry Deep Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Wait for Registry Lock
        run: |
          while doctl registry garbage-collection get-active >/dev/null 2>&1; do
            sleep 20
          done

      - name: Force Purge Old Manifests
        run: |
          ALL_MANIFESTS=$(doctl registry repository list-manifests boilerbridge --format Digest,Tags --no-header)

          echo "$ALL_MANIFESTS" | while read -r line; do
            DIGEST=$(echo "$line" | awk '{print $1}')
            TAGS=$(echo "$line" | awk '{for(i=2;i<=NF;i++) printf "%s ", $i}')
            
            if [ "$DIGEST" = "Digest" ]; then continue; fi
            
            if [ -z "$TAGS" ] || [ "$TAGS" = "[]" ] || [ "$TAGS" = " " ]; then
              doctl registry repository delete-manifest boilerbridge "$DIGEST" --force || true
              continue
            fi
            
            if echo "$TAGS" | grep -qE "latest|pr-"; then
              continue
            fi
            
            doctl registry repository delete-manifest boilerbridge "$DIGEST" --force || true
          done

      - name: Start Final Prune
        run: doctl registry garbage-collection start --include-untagged-manifests --force || true
