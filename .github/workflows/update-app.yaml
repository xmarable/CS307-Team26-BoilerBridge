name: Update App

on:
  push:
    branches: [main]

concurrency:
  group: production_deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ fromJson(steps.deploy.outputs.app).live_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.digitalocean.com
          username: "xmarable2@gmail.com"
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Create clean tag
        id: vars
        run: echo "tag=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            registry.digitalocean.com/boilerbridge-registry/boilerbridge:latest
            registry.digitalocean.com/boilerbridge-registry/boilerbridge:v${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Cleanup
        run: |
          # 1. isolate only the first column (the tag) to fix 'invalid tag format'
          NEW_TAG="v${{ steps.vars.outputs.tag }}"

          # awk '{print $1}' stops the '0 B' and 'UTC' junk from breaking the command, and grep -v excludes 'latest' and the new tag from deletion
          TAGS_TO_DELETE=$(doctl registry repository list-tags boilerbridge --no-header | awk '{print $1}' | grep -v '^latest$' | grep -v "$NEW_TAG")

          if [ ! -z "$TAGS_TO_DELETE" ]; then
            echo "$TAGS_TO_DELETE" | xargs -I {} doctl registry repository delete-tag boilerbridge {} --force || true
          fi

          # 2. force GC to actually wipe the physical bytes
          doctl registry garbage-collection start boilerbridge-registry --include-untagged-manifests --force

      - name: Deploy to App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_TAG_BOILERBRIDGE_WEB: "latest"
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: app.yaml
          app_name: "cs307-team26-boilerbridge"
