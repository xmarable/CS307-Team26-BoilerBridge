name: Update App

on:
  push:
    branches: [main]

concurrency:
  group: production_deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ fromJson(steps.deploy.outputs.app).live_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.digitalocean.com
          username: "xmarable2@gmail.com"
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            registry.digitalocean.com/boilerbridge-registry/boilerbridge:${{ github.sha }}
            registry.digitalocean.com/boilerbridge-registry/boilerbridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Deploy to App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_TAG_BOILERBRIDGE: "latest"
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: app.yaml
          app_name: "cs307-team26-boilerbridge"
