name: Sync BoilerBridge Docs

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # --- THIS IS THE FIX ---
    # We explicitly give the token permission to write code
    permissions:
      contents: write
    # -----------------------
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > credentials.json

      - name: Sync BoilerBridge Folder
        uses: r7kamura/google-docs-to-github@v3
        with:
          # Your specific BoilerBridge folder ID
          google_drive_folder_id: '1aSBqeWVH9GSI8Zc5MbiIQetEFsCwv319'
          github_directory: 'docs'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json

      - name: Cleanup Credentials
        if: always()
        run: rm credentials.json

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          
          if git diff --staged --quiet; then
            echo "No changes in BoilerBridge docs."
          else
            git commit -m "Auto-sync: BoilerBridge docs update"
            git push
          fi
