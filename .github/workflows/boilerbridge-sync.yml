- name: Create credentials
        # This creates the physical file from your GitHub Secret
        run: echo '${{ secrets.GCP_SA_KEY }}' > credentials.json

      - name: Sync BoilerBridge Folder
        uses: r7kamura/google-docs-to-github@v3
        with:
          # Updated to the specific names the Action expects
          google_drive_folder_id: '1aSBqeWVH9GSI8Zc5MbiIQetEFsCwv319'
          github_directory: 'docs'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # This line fixes the "Could not load default credentials" error
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json

      - name: Cleanup
        if: always()
        run: rm credentials.json
