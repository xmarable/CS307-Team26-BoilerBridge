name: Sync BoilerBridge Docs

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # Use your PAT to checkout so we have permission to push later
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Configure Git User
        # THIS FIXES ERROR 128: We introduce ourselves before doing anything
        run: |
          git config --global user.name "Xavion Marable"
          git config --global user.email "xmarable@purdue.edu"

      - name: Create credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > credentials.json

      - name: Sync BoilerBridge Folder
        uses: r7kamura/google-docs-to-github@v3
        with:
          google_drive_folder_id: '1aSBqeWVH9GSI8Zc5MbiIQetEFsCwv319'
          github_directory: 'docs'
          # Use the strong token here too
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json

      - name: Cleanup Credentials
        if: always()
        run: rm credentials.json
