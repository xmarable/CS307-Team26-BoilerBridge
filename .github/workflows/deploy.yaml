name: Update App

on:
  push:
    branches: [main]

concurrency:
  group: production_deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

# Prepare for Node.js update
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    # Export the URL for the next job
    outputs:
      live_url: ${{ fromJson(steps.deploy.outputs.app).live_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Corrected login method to avoid 401 Unauthorized errors
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: registry.digitalocean.com/boilerbridge-registry/boilerbridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Clean up old images
        run: doctl registry garbage-collection start --include-untagged-manifests --force

      - name: Deploy to App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_TAG_boilerbridge: "latest"
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: app.yaml
          app_name: "cs307-team26-boilerbridge"
          print_build_logs: true
          print_deploy_logs: true

  # Separate job to set the environment URL after deployment succeeds
  set-production-url:
    needs: deploy-app
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ needs.deploy-app.outputs.live_url }}
    steps:
      - run: echo "Production URL updated in GitHub."
