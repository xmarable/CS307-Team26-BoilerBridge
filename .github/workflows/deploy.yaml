name: Update App

on:
  push:
    branches: [main]

concurrency:
  group: production_deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ fromJson(steps.deploy.outputs.app).live_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: |
            docker buildx build \
              --context . \
              --push \
              --tag registry.digitalocean.com/boilerbridge-registry/boilerbridge:latest \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Clean up old images
        run: doctl registry garbage-collection start --include-untagged-manifests --force

      - name: Deploy to App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_TAG_boilerbridge: "latest"
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: app.yaml
          app_name: "cs307-team26-boilerbridge"
          print_build_logs: true
          print_deploy_logs: true
