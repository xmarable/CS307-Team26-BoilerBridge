name: Update App

on:
  push:
    branches: [main]

concurrency:
  group: production_deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    outputs:
      live_url: ${{ steps.extract_url.outputs.live_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: registry.digitalocean.com/boilerbridge-registry/boilerbridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Clean up old images
        run: doctl registry garbage-collection start --include-untagged-manifests --force

      - name: Deploy to App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_TAG_boilerbridge: "latest"
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: app.yaml
          app_name: "cs307-team26-boilerbridge"
          print_build_logs: true
          print_deploy_logs: true

      - name: Extract Live URL
        id: extract_url
        shell: bash
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.app }}
        run: |
          if [ -z "$DEPLOY_OUTPUT" ]; then
            echo "Error: deploy output is empty"
            exit 1
          fi
          
          URL=$(echo "$DEPLOY_OUTPUT" | jq -r '.live_url')
          
          if [ "$URL" == "null" ] || [ -z "$URL" ]; then
            echo "Error: could not parse live_url from output"
            exit 1
          fi
          
          echo "live_url=$URL" >> $GITHUB_OUTPUT

  set-production-url:
    needs: deploy-app
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ needs.deploy-app.outputs.live_url }}
    steps:
      - name: Log Success
        run: |
          echo "Production environment URL updated."
          echo "Deployment succeeded for: ${{ needs.deploy-app.outputs.live_url }}"
