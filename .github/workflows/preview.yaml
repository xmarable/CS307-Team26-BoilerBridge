name: App Platform Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PR image
        uses: docker/build-push-action@v5
        with:
          context: .
          retries: 3
          push: true
          tags: registry.digitalocean.com/boilerbridge-registry/boilerbridge:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Clean up old images
        run: doctl registry garbage-collection start --include-untagged-manifests --force

      - name: Deploy PR Preview
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_TAG_boilerbridge: "pr-${{ github.event.number }}"
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: app.yaml
          deploy_pr_preview: "true"
          image: registry.digitalocean.com/boilerbridge-registry/boilerbridge:pr-${{ github.event.number }}
          print_build_logs: true
          print_deploy_logs: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 BoilerBridge Preview deployed at ${{ fromJson(steps.deploy.outputs.app).live_url }}`
            })
