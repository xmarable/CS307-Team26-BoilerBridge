name: App Platform Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview:
    runs-on: ubuntu-latest
    outputs:
      live_url: ${{ fromJson(steps.deploy.outputs.app).live_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.digitalocean.com
          username: "xmarable2@gmail.com"
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PR image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: registry.digitalocean.com/boilerbridge-registry/boilerbridge:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Deploy PR Preview
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_TAG_boilerbridge: "pr-${{ github.event.number }}"
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: app.yaml
          deploy_pr_preview: "true"
          print_build_logs: true
          print_deploy_logs: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const appData = JSON.parse('${{ steps.deploy.outputs.app }}');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 BoilerBridge Preview deployed at ${appData.live_url}`
            })

  set-preview-url:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: Preview/pr-${{ github.event.number }}
      url: ${{ needs.preview.outputs.live_url }}
    steps:
      - run: echo "Preview URL updated in GitHub UI."
