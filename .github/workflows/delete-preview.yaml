name: Delete Preview

on:
  pull_request:
    types: [closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  deployments: write

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview app
        uses: digitalocean/app_action/delete@v2
        with:
          from_pr_preview: "true"
          ignore_not_found: "true"
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Delete registry image and prune orphans
        run: |
          # delete the specific pr manifest first
          DIGEST=$(doctl registry repository list-manifests boilerbridge --format Digest,Tags --no-header | grep "pr-${{ github.event.number }}" | awk '{print $1}')

          if [ ! -z "$DIGEST" ]; then
            echo "deleting pr manifest $DIGEST"
            doctl registry repository delete-manifest boilerbridge "$DIGEST" --force
          fi

          # forcefully nuke all untagged manifests so gc actually works
          UNTAGGED=$(doctl registry repository list-manifests boilerbridge --format Digest,Tags --no-header | awk '$2 == "" || $2 == "[]" {print $1}')

          if [ ! -z "$UNTAGGED" ]; then
            for digest in $UNTAGGED; do
              echo "deleting untagged manifest $digest"
              doctl registry repository delete-manifest boilerbridge $digest --force || true
            done
          fi

          # retry loop for 409 errors
          echo "checking for active garbage collection..."
          while doctl registry garbage-collection get-active >/dev/null 2>&1; do
            echo "gc is currently running. sleeping for 20s..."
            sleep 20
          done

          echo "starting new garbage collection..."
          doctl registry garbage-collection start --include-untagged-manifests --force || true

      - name: Deactivate GitHub Environment
        uses: actions/github-script@v7
        with:
          script: |
            const envName = `Preview/pr-${context.issue.number}`;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: envName
            });

            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive'
              });
            }
